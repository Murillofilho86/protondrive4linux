[package]
name = "protondrive4linux"
version = "0.4.2"
edition = "2021"
description = "Bidirectional Proton Drive folder sync built on the official proton-drive CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Murillofilho86/protondrive4linux"
homepage = "https://github.com/Murillofilho86/protondrive4linux"

# Library core (reused by the CLI now, and a GUI later) + a thin CLI binary.
# The lib keeps its original internal crate name (neutronsync) - it's Cargo's
# Rust-side identifier only, invisible to end users, and renaming it would
# mean touching every `neutronsync::` path across src/ and tests/ for no
# user-facing benefit.
[lib]
name = "neutronsync"
path = "src/lib.rs"

[[bin]]
name = "protondrive4linux"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha1_smol = "1"
walkdir = "2"
anyhow = "1"
eframe = { version = "0.35", optional = true }
egui-phosphor = { version = "0.13", optional = true, default-features = false, features = ["regular"] }
rfd = { version = "0.17.2", optional = true }
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.32", features = ["bundled"] }
winit = { version = "0.30", optional = true }
tray-icon = { version = "0.24", optional = true }
gtk = { version = "0.18", optional = true }
# In-app updates (GUI-only): tiny HTTP client, semver compare, and SHA-256 to
# verify a downloaded package against the digest the release API publishes.
ureq = { version = "2", optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[profile.release]
opt-level = "z"   # optimise for size ("lite")
lto = true
strip = true
codegen-units = 1
panic = "abort"

[features]
# The GUI is opt-in so the CLI stays dependency-light:
#   cargo run --features gui --bin protondrive4linux-gui
gui = [
    "dep:eframe",
    "dep:rfd",
    "dep:egui-phosphor",
    "dep:winit",
    "dep:tray-icon",
    "dep:gtk",
    "dep:ureq",
    "dep:semver",
    "dep:sha2",
]

[[bin]]
name = "protondrive4linux-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

# Test-only fixture: a minimal proton-drive CLI stand-in (list/upload/download/
# create-folder/trash/version against a plain directory tree, no network) used
# by tests/disaster/ to run the real protondrive4linux binary as a subprocess
# and send it real signals - something an in-process FakeRemote (tests/engine.rs)
# can't exercise. Not part of the shipped product; PKGBUILD/.deb/.rpm only
# install the two binaries above by name.
[[bin]]
name = "fake-proton-drive"
path = "tests/support/fake_proton_drive.rs"
test = false
doc = false

# --- Packaging -------------------------------------------------------------
# Built by .github/workflows/release.yml on a v* tag. Both packages ship the
# CLI, the GUI, the .desktop entry, and the systemd --user units. The GUI
# binary is one of the assets, so packaging requires the `gui` feature:
#   cargo deb --features gui         &&   cargo generate-rpm
# proton-drive is a runtime prerequisite (not in distro repos) - see README.
[package.metadata.deb]
maintainer = "Murillofilho86 <murillohard@hotmail.com>"
copyright = "2026 Wilhelm Schonfeldt, 2026 Murillofilho86"
section = "utils"
priority = "optional"
depends = "$auto, libgl1, libxkbcommon0"
extended-description = """\
Bidirectional Proton Drive folder sync built on the official proton-drive CLI. \
Ships a CLI (protondrive4linux) and a native GUI (protondrive4linux-gui). Requires the \
proton-drive CLI to be installed separately."""
assets = [
    ["target/release/protondrive4linux", "usr/bin/", "755"],
    ["target/release/protondrive4linux-gui", "usr/bin/", "755"],
    ["packaging/protondrive4linux-gui.desktop", "usr/share/applications/", "644"],
    ["assets/logo.png", "usr/share/icons/hicolor/256x256/apps/protondrive4linux.png", "644"],
    ["assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/protondrive4linux.svg", "644"],
    ["systemd/protondrive4linux-watch.service", "usr/lib/systemd/user/", "644"],
    ["systemd/protondrive4linux.service", "usr/lib/systemd/user/", "644"],
    ["systemd/protondrive4linux.timer", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/protondrive4linux/README.md", "644"],
    ["LICENSE", "usr/share/doc/protondrive4linux/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/protondrive4linux", dest = "/usr/bin/protondrive4linux", mode = "755" },
    { source = "target/release/protondrive4linux-gui", dest = "/usr/bin/protondrive4linux-gui", mode = "755" },
    { source = "packaging/protondrive4linux-gui.desktop", dest = "/usr/share/applications/protondrive4linux-gui.desktop", mode = "644" },
    { source = "assets/logo.png", dest = "/usr/share/icons/hicolor/256x256/apps/protondrive4linux.png", mode = "644" },
    { source = "assets/logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/protondrive4linux.svg", mode = "644" },
    { source = "systemd/protondrive4linux-watch.service", dest = "/usr/lib/systemd/user/protondrive4linux-watch.service", mode = "644" },
    { source = "systemd/protondrive4linux.service", dest = "/usr/lib/systemd/user/protondrive4linux.service", mode = "644" },
    { source = "systemd/protondrive4linux.timer", dest = "/usr/lib/systemd/user/protondrive4linux.timer", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/protondrive4linux/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/protondrive4linux/LICENSE", mode = "644" },
]

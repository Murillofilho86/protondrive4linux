<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- rounded-square badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- two crossing orbits -->
  <g transform="translate(128,128)" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.9">
    <ellipse rx="84" ry="33" transform="rotate(45)"/>
    <ellipse rx="84" ry="33" transform="rotate(135)"/>
  </g>
  <!-- electrons on the orbit ends -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="187" cy="69"  r="10"/>
    <circle cx="69"  cy="187" r="10"/>
  </g>
  <!-- neutral nucleus -->
  <circle cx="128" cy="128" r="25" fill="#FFFFFF"/>
</svg>

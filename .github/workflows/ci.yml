name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # System libraries needed to build the egui/eframe GUI (glow/winit) and
      # the rfd native file dialog.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev \
            libxdo-dev libayatana-appindicator3-dev

      - name: Build (lib + CLI)
        run: cargo build --workspace --all-targets

      - name: Build (with GUI)
        run: cargo build --features gui --bin protondrive4linux-gui

      - name: Test
        run: cargo test --all-features

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    runs-on: ubuntu-latest
    # Lets the action publish its findings as a native Check annotation
    # instead of falling back to a bare log dump ("Resource not accessible
    # by integration") when the repo's default GITHUB_TOKEN is read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: "RUSTSEC-2024-0429,RUSTSEC-2026-0194"
          # RUSTSEC-2024-0429: unsound VariantStrIter in glib 0.18.5, pulled
          # in transitively by gtk 0.18 (tray-icon's `libappindicator`
          # backend requires gtk ^0.18; even tray-icon's latest release,
          # 0.24.2, still does). No fix exists below gtk-rs 0.19, and
          # bumping the whole gtk-rs stack isn't something we control from
          # here. Our own code never touches VariantStrIter directly.
          # Re-check when tray-icon (or libappindicator) moves off gtk 0.18.
          #
          # RUSTSEC-2026-0194: quadratic-time attribute-dedup check in
          # quick-xml 0.39.4, pulled in transitively by wayland-scanner (a
          # build-time-only proc-macro that codegens Wayland protocol
          # bindings from XML bundled with the crate itself - fixed, trusted
          # input, never attacker-controlled, and not present in the shipped
          # binary at all). wayland-scanner pins quick-xml = "^0.39"; the fix
          # is >=0.41.0, not available within that range. Re-check when
          # wayland-scanner bumps its quick-xml requirement.

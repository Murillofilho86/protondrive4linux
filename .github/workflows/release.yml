name: Release

# Tag a release, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before spending 8 minutes on a build that would ship a release
      # nobody can read. Both of these are things a hurried tag gets wrong.
      - name: Check the tag against Cargo.toml and the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"

          crate="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)"
          if [ "$crate" != "$ver" ]; then
            echo "::error::tag is ${GITHUB_REF_NAME} but Cargo.toml says ${crate}."
            echo "Bump the version and re-tag (scripts/release.sh does both)."
            exit 1
          fi

          if ! grep -qE "^## \[${ver//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section."
            echo "The release body comes from that section, so a release"
            echo "without one says nothing about what changed."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev \
            libxdo-dev libayatana-appindicator3-dev

      # Belt-and-suspenders: master's branch protection already requires the
      # CI workflow's test job to pass before a merge lands, so this commit
      # was tested before the tag was cut. Re-running here costs a couple of
      # minutes and catches anything odd about the tagged commit itself
      # (a tag pushed to a non-master ref, a stale local branch, etc.)
      # before it ships as a release.
      - name: Test
        run: cargo test --all-features

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries (CLI + GUI)
        run: cargo build --release --features gui --bins

      - name: Strip binaries
        run: strip target/release/protondrive4linux target/release/protondrive4linux-gui || true

      - name: Package .deb
        run: cargo deb --no-build --features gui

      - name: Package .rpm
        run: cargo generate-rpm

      - name: Source tarball
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          git archive --format=tar.gz \
            --prefix="protondrive4linux-${ref}/" \
            -o "dist/protondrive4linux-${ref}-src.tar.gz" HEAD

      - name: Binary tarball (portable, for the in-app updater)
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          stage="stage/protondrive4linux-${ref}"
          mkdir -p "$stage"
          cp target/release/protondrive4linux target/release/protondrive4linux-gui \
             README.md LICENSE "$stage/"
          tar -C stage -czf "dist/protondrive4linux-${ref}-x86_64-linux.tar.gz" "protondrive4linux-${ref}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm dist/ 2>/dev/null || true
          ls -l dist/

      # Signing is off until RELEASE_SIGNING_READY is flipped on (see
      # docs/contributing/RELEASE_SIGNING.md) - there's no key yet to sign
      # with. Once it's on, this must fail rather than silently ship an
      # unsigned release: a flipped-on flag with a missing secret is a
      # broken promise to anyone relying on M2-001, not a reason to skip.
      - name: Require signing secrets once release signing is enabled
        if: ${{ vars.RELEASE_SIGNING_READY == 'true' }}
        run: |
          [ -n "${{ secrets.GPG_SIGNING_KEY }}" ] ||
            { echo "::error::RELEASE_SIGNING_READY is true but GPG_SIGNING_KEY secret is missing"; exit 1; }
          [ -n "${{ vars.GPG_SIGNING_KEY_FINGERPRINT }}" ] ||
            { echo "::error::RELEASE_SIGNING_READY is true but GPG_SIGNING_KEY_FINGERPRINT var is missing"; exit 1; }

      - name: Import release-signing GPG subkey
        if: ${{ vars.RELEASE_SIGNING_READY == 'true' }}
        run: gpg --batch --import <<< "${{ secrets.GPG_SIGNING_KEY }}"

      - name: Sign release artifacts
        if: ${{ vars.RELEASE_SIGNING_READY == 'true' }}
        run: |
          shopt -s nullglob
          targets=(dist/*.deb dist/*.rpm dist/*-x86_64-linux.tar.gz dist/*-src.tar.gz)
          for f in "${targets[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}" \
              --local-user "${{ vars.GPG_SIGNING_KEY_FINGERPRINT }}" \
              --detach-sign --armor "$f"
          done
          missing=0
          for f in "${targets[@]}"; do
            [ -e "$f.asc" ] || { echo "::error::no signature produced for $f"; missing=1; }
          done
          [ "$missing" -eq 0 ]
          ls -l dist/*.asc

      # Release notes come from CHANGELOG.md, not GitHub's generated commit list:
      # the changelog says what changed and why, the commit list just repeats the
      # subject lines. Pull out the section for this tag's version.
      - name: Release notes from the changelog
        run: |
          mkdir -p dist
          git fetch --tags --force --quiet
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::the '## [${ver}]' section of CHANGELOG.md is empty."
            exit 1
          fi
          prev="$(git tag --sort=-creatordate --list 'v*' \
                  | grep -vFx "$GITHUB_REF_NAME" | head -1)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> dist/notes.md
          fi
          echo '--- notes ---'
          cat dist/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Published, not a draft: the updater skips drafts, so a draft
          # release is invisible to the app until someone publishes it by hand.
          # Pushing a tag is the decision to ship a pre-release.
          draft: false
          # Every tag ships as a pre-release. Promotion to stable is a separate,
          # deliberate decision made once a build has proven itself:
          #   scripts/promote.sh X.Y.Z
          # That release then carries GitHub's "Latest" badge, which only ever
          # sits on one release at a time, and the updater's stable channel
          # starts offering it. The prerelease channel sees every tag as it lands.
          prerelease: true
          # Never move the "Latest" badge onto a fresh build; promotion does that.
          make_latest: false
          name: protondrive4linux ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*-x86_64-linux.tar.gz
            dist/*-src.tar.gz
            dist/*.asc

  aur-publish:
    needs: release
    runs-on: ubuntu-latest
    # Skip cleanly (not a failed run) until the AUR_ACCOUNT_READY repo
    # variable is "true". As of 2026-09-08 the AUR isn't accepting new
    # account registrations (an orphaned-packages incident), so the account
    # this needs can't be created yet. Once it exists and the three repo
    # secrets below (AUR_USERNAME, AUR_EMAIL, AUR_SSH_PRIVATE_KEY) are set,
    # flip this variable to turn the job on - no other change needed.
    if: ${{ vars.AUR_ACCOUNT_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # PKGBUILD is the -git (rolling) variant: pkgver() computes the
      # version from `git describe` at build time on the user's machine, so
      # nothing here needs to bump a version or update checksums per tag -
      # publishing on every release just keeps the AUR copy in sync with
      # what master (already tested and built above) actually contains.
      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4
        with:
          pkgname: protondrive4linux-git
          pkgbuild: ./PKGBUILD
          assets: protondrive4linux.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

name: Release

# Tag a release, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev \
            libxdo-dev libayatana-appindicator3-dev

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries (CLI + GUI)
        run: cargo build --release --features gui --bins

      - name: Strip binaries
        run: strip target/release/neutronsync target/release/neutronsync-gui || true

      - name: Package .deb
        run: cargo deb --no-build --features gui

      - name: Package .rpm
        run: cargo generate-rpm

      - name: Source tarball
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          git archive --format=tar.gz \
            --prefix="neutronsync-${ref}/" \
            -o "dist/neutronsync-${ref}-src.tar.gz" HEAD

      - name: Binary tarball (portable, for the in-app updater)
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          stage="stage/neutronsync-${ref}"
          mkdir -p "$stage"
          cp target/release/neutronsync target/release/neutronsync-gui \
             README.md LICENSE "$stage/"
          tar -C stage -czf "dist/neutronsync-${ref}-x86_64-linux.tar.gz" "neutronsync-${ref}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm dist/ 2>/dev/null || true
          ls -l dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true          # review the draft, then publish manually
          # Every release starts life as a pre-release. Promote one to the
          # stable channel by unticking "Set as a pre-release" on the published
          # release; the updater's stable channel then picks it up.
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*-x86_64-linux.tar.gz
            dist/*-src.tar.gz
